# [Dataset]
model.m = 6
model.h0 = 256
dataset.name = "GLOVE100"
dataset.data_root = "data/glove100"
dataset.train_path = "glove100_train_300k.fvecs"
dataset.ntrain = 300000
dataset.base_path = "glove100_base_after_train_300k.fvecs"
dataset.base_first_row = 0
dataset.nbase = 883514
dataset.query_path = "glove100_query.fvecs"
dataset.groundtruth_path = "glove100_groundtruth_after_train_300k.ivecs"
dataset.nquery = 10000
dataset.k = 100
dataset.groundtruth_add1 = false
large.train_format = "fvecs"
large.base_format = "fvecs"
large.query_format = "fvecs"
large.gt_format = "ivecs"

# [Common / Pipeline stages]
advanced.eval_only = false
train.init_enabled = true
train.enabled = true
base.encode.enabled = true
base.linkage.enabled = true

# [Common / Artifact names and paths]
io.pre_fix = "glove100_train300k_m6"
io.train_file = ""
io.linkage_file = ""
large.output_dir = "outputs"
large.tmp_dir = "tmp"
large.protect_existing_outputs = true

# [Common / Linkage evaluation]
eval.linkage.enabled = true  # Evaluate the final linkage index
eval.linkage.modes = [float, quantized, quantized_scaled]  # float / float_scaled / quantized / quantized_scaled; multiple modes allowed
eval.linkage.score_mode = "l2"
eval.disk_norm2_mode = "lut"  # lut / exact; independent of coefficient representation
eval.disk_norm2_lut_mode = "identity"  # identity / tail_weighted / reference
eval.disk_norm2_lut_kmeans_niter = 50
eval.linkage.gpu_norm_enable = true  # Prepare norms on the GPU
eval.linkage.nprobe = [256]  # Scalar or list; model.h0 scans all IVF lists
eval.linkage.warmup = 0
eval.linkage.repeat = 1
eval.metric_gt_topks = [1,10,50,100]

eval.linkage.parent_louds_native_eval = false  # true: decode LOUDS during scanning; false: materialize parents at load time

# [Common / IVF routing]
eval.linkage.ivf_probe_mode = "exact"  # exact / hnsw IVF routing
eval.linkage.ivf_hnsw_M = 32  # Routing-graph connectivity for hnsw mode
eval.linkage.ivf_hnsw_ef_construction = 200  # HNSW construction search budget
eval.linkage.ivf_hnsw_ef_search = 32  # HNSW search budget; also accepts [32,64,128]

# [Common / Basic evaluation]
eval.base.enabled = false  # Evaluate basic codes; separate from basic encoding
eval.base.nprobe = 8  # Basic IVF probe count; model.h0 scans all lists
eval.base.warmup = 0
eval.base.repeat = 1

# [Common / Training and basic encoding]
train.max_R_iters = 25  # Training rounds after initialization
train.seed = 1985326
train.init_samples = 5000000
train.use_opq_rotation = true
train.kmeans_init = "kmeansll"  # kmeansll / kmeans++ / random
train.kmeans_iters = 50
train.encode.rsd_rank = 2  # Basic RSD rank: 1 / 2 / 3
train.encode.icm_iters = 4
train.encode.ils_iters = 8
train.encode.perturb_k = 3
base.encode.seed = 38251450
base.encode.rsd_rank = 2  # Basic RSD rank: 1 / 2 / 3
base.encode.icm_iters = 4
base.encode.ils_iters = 16
base.encode.perturb_k = 3

# [Common / Training topology]
train.linkage.num_layers = 12  # Radial layer count, independent of model.m
train.linkage.depth_k = 10  # Parent candidate layer window
train.linkage.knn_k = 15  # Nearby-parent candidate budget
train.linkage.root_percentile = 0.01
train.linkage.max_depth = 40
train.linkage.rsd_rank = 2  # Linkage RSD rank: 1 / 2 / 3, including training Replay
train.linkage.icm_round = 1
train.linkage.seed = 49979687

# [Common / Base topology]
base.linkage.num_layers = 14  # Radial layer count, independent of model.m
base.linkage.depth_k = 13  # Parent candidate layer window
base.linkage.knn_k = 35  # Nearby-parent candidate budget
base.linkage.root_percentile = 0.01
base.linkage.max_depth = 40
base.linkage.rsd_rank = 2  # Linkage RSD rank: 1 / 2 / 3
base.linkage.icm_round = 1
base.linkage.seed = 86028121

# [Common / GOOD-BAD clusters and virtual roots]
virtual.enabled = true
virtual.good_fraction = 0.2  # Fraction of GOOD clusters; remaining clusters use BAD topology
virtual.alpha_bad = 0.6  # BAD-cluster edge-update weight
virtual.virtual_ratio = 0.08  # Virtual-root count relative to the cluster population
virtual.min_virtual = 1  # Minimum virtual roots per cluster
virtual.max_virtual = 20000  # Maximum virtual roots per cluster
virtual.use_fixed_virtual_per_cluster = false  # true: fixed count below; false: ratio-based count
virtual.fixed_virtual_per_cluster = 256  # Virtual roots per cluster in fixed-count mode

# [Common / Coefficient widths]
large.linkage_coeff_codec.enabled = true
large.linkage_coeff_codec.bits_per_layer = []
large.linkage_coeff_codec.bits_per_layer_root = [5]  # Root widths; [] inherits shared widths
large.linkage_coeff_codec.bits_per_layer_linkage = [4]  # Linked-row widths; [] inherits shared widths
large.linkage_coeff_codec.p_first_candidates = [99.95]  # Layer-zero clipping percentile candidates
large.linkage_coeff_codec.p_rest_candidates = [99.95]  # Remaining-layer clipping percentile candidates

# [Common / Resources and block sizes]
runtime.use_cuda = true
runtime.cuda_device = 0
runtime.omp_threads = 32
runtime.cuda_mode = "fast"  # fast / strict
runtime.cuda_allow_tf32 = true
runtime.cuda_pool_size = 12
runtime.cuda_linkage_cross_cluster_batch = true
runtime.cuda_linkage_cross_cluster_workers = 4  # Cross-cluster scheduler workers
stlqpp.linkage_scheduler.stable = 1
large.train_block = 200000
large.base_block = 200000

# [Initialization / K-means]
train.kmeans_tol = 0.000001
train.kmeansll_rounds = 8
train.kmeansll_oversample = 16
train.kmeansll_candidate_cap = 0
train.kmeansll_seed = 0
train.kmeans_initial_weight = 1
train.kmeans_min_weight = 0.1
train.kmeans_outlier_quantile = 0.85
train.kmeans_cost_threshold = 0.115
train.kmeans_annealing_factor = 0.9
train.kmeans_warmup_iters = 2
train.kmeans_quantile_bins = 65536
train.kmeans_device_cache_mb = 20480

# [Initialization / Hierarchical k-means for large IVF]
train.kmeans_large_k_threshold = 4096
train.kmeans_large_k_top_coarse = 1
train.kmeans_large_k_hier2_enable = true
train.kmeans_large_k_fixed_k1 = 0
train.kmeans_large_k_k1_min = 128
train.kmeans_large_k_k1_max = 1024
train.kmeans_large_k_k1_pow2 = true

# [Training / Initialization and solvers]
train.init_linkage_mode = "legacy_root_only"
train.init_linkage_icm_round = 1
least_squares.cost_mode = "explicit_quadratic"  # normal_equation / explicit_quadratic
runtime.c_one_update_shards_init_linkage = 16
runtime.c_one_update_shards = 16

# [Virtual roots / Anchor neighborhoods]
virtual.umap_knn_k = 50
virtual.local_connectivity = 1
virtual.overlap_thr = 0.9
virtual.prefer_peaks = true
virtual.anchor_neighbor_k = 16

# [Coefficient codec / Fitting]
large.linkage_coeff_codec.use_weighted_quantile = true
large.linkage_coeff_codec.allow_clip = true
large.linkage_coeff_codec.fit_scale = true
large.linkage_coeff_codec.q_refine_sweeps = 3
large.linkage_coeff_codec.q_refine_max_layer = 0
large.linkage_coeff_codec.q_refine_step_limit = 1

# [Runtime / Checkpoints]
train.ckpt.enabled = false
train.ckpt.every_R = 0
large.base_basic_checkpoint = false
large.linkage_checkpoint = false

# [Runtime / Logging]
train.log_metrics = true
train.log_linkage_pre_c1 = false
large.profile_timing = false
large.archive_log = true

# [Runtime / Artifact retention]
large.base_linkage_store_coeffs_f32 = true
large.cleanup.enabled = true
large.cleanup.preset = "eval_both"

# [Runtime / CPU and asynchronous IO]
runtime.omp_places = ""
runtime.omp_proc_bind = ""
runtime.basic_inflight_blocks = 64
runtime.basic_async_io = true
runtime.basic_async_io_depth = 6
runtime.basic_async_io_mb = 1024
runtime.basic_async_write = true
runtime.basic_async_write_depth = 8
runtime.basic_async_write_mb = 0
runtime.linkage_async_io = true
runtime.linkage_async_io_depth = 6
large.cluster_bucket_size = 256
large.bucket_flush_mb = 256
large.base_list_build_threads = 32

# [CUDA / Initialization resources]
runtime.cuda_pool_size_init_linkage = 12
runtime.cuda_linkage_eval_async_pinned_mb_init_linkage = 256
runtime.cuda_linkage_large_root_xc0_chunk_mb_init_linkage = 256
runtime.cuda_linkage_mem_budget_mb_init_linkage = 512
runtime.cuda_linkage_many_nodes_max_pairs_init_linkage = 8192
runtime.cuda_linkage_init_same_layer_tiny_forced_cpu_enable = true
runtime.cuda_linkage_chunk_max_pairs_init_linkage = 0

